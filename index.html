<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integração Supabase</title>
    
    <!-- 1. Importação da biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Meu Projeto com Supabase</h1>
    <p>Abra o console do navegador (F12) para ver os resultados da conexão.</p>

    <script>
        // 2. Credenciais do seu projeto
        const SUPABASE_URL = 'https://djgwbjieslxqvhatfirc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_hv5R2009VodI3IYGu4mv_g_mOWmZVvp';

        // 3. Inicialização do cliente Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Exemplo de função para testar a conexão buscando dados de uma tabela
        // (Substitua 'sua_tabela' pelo nome real de uma tabela que você criou no Supabase)
        async function testarConexao() {
            try {
                const { data, error } = await supabaseClient
                    .from('sua_tabela')
                    .select('*')
                    .limit(5);

                if (error) {
                    console.error('Erro ao buscar dados:', error.message);
                } else {
                    console.log('Dados recebidos com sucesso:', data);
                }
            } catch (err) {
                console.error('Erro inesperado:', err);
            }
        }

        // Executa o teste ao carregar a página
        testarConexao();
    </script>

</body>
</html>
